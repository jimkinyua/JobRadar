# ==============================================================================
# Job-Radar Pipeline Configuration
# ==============================================================================

pipeline:
  name: "jobradar"
  version: "0.1.0"
  min_score: 8.0
  alert_min_score: 9.0  # High-signal threshold: Only send instant Telegram alerts for elite matches (>=9.0)
  near_miss_delta: 2.0  # Jobs within [min_score - 2, min_score] qualify for Monday digest
  max_alerts_per_run: 15
  initial_run_baseline_alerts: 10
  deadline_reminder_days: 3


# ------------------------------------------------------------------------------
# Scoring Engine: Multi-Track Persona System
# ------------------------------------------------------------------------------
# Final Score = max(Track Scores) + Location Bonuses + Seniority Bonuses - Exclusions
# Title match = full weight, Description match = half weight.
scoring:
  # Optional title_any gate: If non-empty, title MUST contain at least one keyword
  # Set to [] to disable title-gate and rely purely on weighted score.
  title_any: []

  # Excluded terms: If found in title, job receives an immediate heavy penalty or disqualification
  exclude_keywords:
    - "intern"
    - "internship"
    - "junior"
    - "graduate"
    - "entry level"
    - "entry-level"
    - "sales"
    - "marketing"
    - "customer care"
    - "unpaid"

  # Location bonuses (added to overall score if matched)
  locations:
    nairobi: 4.0
    kenya: 3.0
    remote: 4.0
    emea: 3.0
    africa: 2.0
    worldwide: 3.0

  # Seniority bonuses
  seniority:
    senior: 2.0
    lead: 2.0
    tech lead: 4.0
    principal: 3.0
    staff: 3.0
    architect: 3.0

  # Multi-Track Persona Keyword Weights
  tracks:
    track_data_engineering:
      name: "Data Engineering & Streaming"
      keywords:
        data engineer: 4.0
        data engineering: 4.0
        etl: 3.0
        kafka: 3.0
        sql: 2.0
        python: 3.0
        azure: 3.0
        spark: 3.0
        pyspark: 3.0
        databricks: 3.0
        pipeline: 3.0
        data pipeline: 4.0
        data warehouse: 3.0
        airflow: 3.0
        dbt: 3.0
        snowflake: 3.0
        bigquery: 3.0
        lakehouse: 3.0
        integration: 3.0
        bi: 2.0
        power bi: 2.0

    track_dotnet_azure:
      name: "Enterprise .NET & Azure Cloud"
      keywords:
        .net: 5.0
        c#: 5.0
        asp.net: 4.0
        azure: 3.0
        sql: 2.0
        logic apps: 3.0
        functions: 2.0
        entra id: 2.0
        integration: 4.0
        full stack: 3.0

    track_modern_backend:
      name: "Modern Backend (Python / Go / Laravel)"
      keywords:
        python: 3.0
        golang: 2.0
        go: 2.0
        laravel: 2.0
        php: 2.0
        sql: 2.0
        kafka: 2.0
        rest api: 2.0
        microservices: 2.0
        full stack: 3.0

    track_fintech_integrations:
      name: "FinTech & System Integrations"
      keywords:
        etims: 4.0
        tax: 2.0
        payments: 3.0
        m-pesa: 3.0
        integration: 4.0
        rest api: 2.0
        banking: 2.0

    track_leadership_qa:
      name: "Engineering Leadership & QA Automation"
      keywords:
        tech lead: 4.0
        lead: 2.0
        senior: 2.0
        test automation: 3.0
        qa: 2.0
        full stack: 3.0

    track_ai_ml:
      name: "AI & Machine Learning Engineering"
      keywords:
        ai: 3.0
        llm: 4.0
        rag: 3.0
        embeddings: 3.0
        langchain: 3.0
        langgraph: 3.0
        agents: 3.0
        pytorch: 3.0
        fine-tuning: 3.0
        vector database: 3.0
        data scientist: 3.0
        machine learning: 3.0
        deep learning: 3.0
        artificial intelligence: 3.0

    track_fullstack_web:
      name: "Full-Stack & Modern Web"
      keywords:
        full stack: 4.0
        fullstack: 4.0
        software engineer: 3.0
        software engineering: 3.0
        software developer: 3.0
        typescript: 4.0
        javascript: 3.0
        react: 4.0
        next.js: 4.0
        nextjs: 4.0
        vue: 3.0
        node.js: 3.0
        nodejs: 3.0
        node: 2.0
        frontend: 3.0
        front end: 3.0
        graphql: 3.0
        rest api: 2.0
        web application: 2.0

    track_platform_devops:
      name: "Platform & DevOps Engineering"
      keywords:
        devops: 4.0
        platform engineer: 4.0
        site reliability: 4.0
        sre: 3.0
        cloud engineer: 3.0
        infrastructure: 3.0
        docker: 3.0
        kubernetes: 4.0
        k8s: 4.0
        terraform: 3.0
        ci/cd: 3.0
        github actions: 3.0
        aws: 3.0
        azure: 3.0
        linux: 2.0

# ------------------------------------------------------------------------------
# Source Ingestion & Health Check Thresholds

# ------------------------------------------------------------------------------
health_monitoring:
  drop_threshold_percent: 50.0  # Alert if volume drops >50% vs previous run
  alert_on_zero: true            # Alert if an active source returns 0 listings

# ------------------------------------------------------------------------------
# Configured Sources (Governed by 5-Point Source Acceptance Testing)
# ------------------------------------------------------------------------------
sources:
  # ============================================================================
  # VERIFIED & ENABLED SOURCES (Passed 5/5 Acceptance Criteria on 3 consecutive runs)
  # ============================================================================
  - id: "remotive"
    name: "Remotive Remote Software Jobs"
    type: "remotive"
    url: "https://remotive.com/api/remote-jobs?category=software-dev"
    enabled: true

  - id: "weworkremotely"
    name: "We Work Remotely Backend RSS"
    type: "rss"
    url: "https://weworkremotely.com/categories/remote-back-end-programming-jobs.rss"
    enabled: true

  - id: "corporate_staffing"
    name: "Corporate Staffing Kenya Vacancies"
    type: "html"
    url: "https://www.corporatestaffing.co.ke/jobs/"
    enabled: true
    selectors:
      item: "article, .job-listing, tr, li"
      title: "h3, h4, a[href*='/job/']"
      link: "a[href*='/job/']"
      location: ".location"
      description: "p, .summary"

  - id: "jobwebkenya"
    name: "JobWebKenya Feed"
    type: "rss"
    url: "https://jobwebkenya.com/feed/"
    enabled: true

  - id: "watu_credit"
    name: "Watu Credit Careers"
    type: "html"
    url: "https://watu.applytojob.com"
    enabled: true
    selectors:
      item: "li.list-group-item, .job-item"
      title: "h4.list-group-item-heading, a"
      link: "a"
      location: ".text-muted, .location"
      description: ".description, p"

  - id: "davis_shirtliff"
    name: "Davis & Shirtliff Careers"
    type: "html"
    url: "https://www.davisandshirtliff.com/careers"
    enabled: true
    selectors:
      item: ".vacancy-item, article, tr"
      title: "h3, h4, .title, a"
      link: "a"
      location: ".location"
      description: "p, .summary"

  - id: "britam"
    name: "Britam Careers"
    type: "html"
    url: "https://www.britam.com/careers"
    enabled: true
    selectors:
      item: ".job-listing, .career-item, article"
      title: "h3, .job-title, a"
      link: "a"
      location: ".job-location"
      description: "p"

  - id: "coop_bank"
    name: "Co-operative Bank of Kenya Careers"
    type: "html"
    url: "https://www.co-opbank.co.ke/career_tax/co-op-bank/"
    enabled: true
    selectors:
      item: ".rounded-lg.shadow-lg, .career-item, article"
      title: "p.text-2xl, .text-primary, h3, h4, .title"
      link: "a[href*='/careers/'], a"
      location: ".location"
      description: "p, .summary"

  - id: "ncba_bank"
    name: "NCBA Group Careers"
    type: "html"
    url: "https://ncbagroup.com/careers/"
    enabled: true
    selectors:
      item: ".job-item, .career-listing, article"
      title: "h3, h4, a"
      link: "a"
      location: ".location"
      description: "p"

  - id: "safaricom"
    name: "Safaricom Careers"
    type: "html"
    url: "https://www.safaricom.co.ke/careers"
    enabled: false # Akamai bot protection returned HTTP 403

  - id: "kpmg_east_africa"
    name: "KPMG East Africa Careers"
    type: "html"
    url: "https://kpmg.com/ke/en/careers.html"
    enabled: true
    selectors:
      item: ".job-card, .search-result, article, li"
      title: "h3, h4, a"
      link: "a"
      location: ".location"
      description: "p"

  - id: "kenya_red_cross"
    name: "Kenya Red Cross Careers"
    type: "html"
    url: "https://redcross.or.ke/careers/"
    enabled: true
    selectors:
      item: ".vacancy-item, article, tr, li"
      title: "h3, h4, a"
      link: "a"
      location: ".location"
      description: "p"

  - id: "kemri_wellcome"
    name: "KEMRI Wellcome Trust Careers"
    type: "html"
    url: "https://kemri-wellcome.org/careers/"
    enabled: true
    selectors:
      item: ".vacancy, .job-row, article, li"
      title: "h3, h4, a"
      link: "a"
      location: ".location"
      description: "p"

  - id: "deloitte_smartrecruiters"
    name: "Deloitte East Africa & Africa"
    type: "smartrecruiters"
    company_identifier: "Deloitte6"
    enabled: true

  - id: "pwc_east_africa"
    name: "PwC Kenya & East Africa"
    type: "workday"
    url: "https://pwc.wd3.myworkdayjobs.com/wday/cxs/pwc/Global_Experienced_Careers/jobs"
    enabled: true
    selectors:
      search_text: "Nairobi"

  - id: "ey_east_africa"
    name: "EY East Africa Careers"
    type: "html"
    url: "https://careers.ey.com/ey/search/?q=Kenya"
    enabled: true
    selectors:
      item: "tr.data-row"
      title: "a.jobTitle-link, a"
      link: "a.jobTitle-link, a"
      location: ".jobLocation"
      description: "td"

  - id: "pkf_eastern_africa"
    name: "PKF Eastern Africa Careers"
    type: "html"
    url: "https://pkfea.com/careers"
    enabled: true
    selectors:
      item: "table tbody tr"
      title: "td:first-child"
      link: "a"
      location: "td:nth-child(3)"
      description: "td"

  # ============================================================================
  # DISABLED SOURCES (Failed 5-Point Acceptance Test - Kept with documented reasons)
  # ============================================================================
  # Fuzu: Failed Criterion 2. Protected by Cloudflare anti-bot challenge page.
  - id: "fuzu"
    name: "Fuzu Kenya"
    type: "html"
    url: "https://www.fuzu.com/kenya/jobs"
    enabled: false

  # ReliefWeb: Failed Criterion 1. robots.txt disallows /v1/ crawling without formal developer token approval.
  - id: "reliefweb"
    name: "ReliefWeb Humanitarian Jobs API"
    type: "reliefweb"
    url: "https://api.reliefweb.int/v1/jobs"
    enabled: false
    requires_env: "RELIEFWEB_APPNAME"

  # saas.group: Failed Criterion 2. Lever public endpoint for slug 'saasgroup' returned 404.
  - id: "saasgroup"
    name: "saas.group (Lever)"
    type: "lever"
    company_identifier: "saasgroup"
    enabled: false

  # MyJobMag: Failed Criterion 2. RSS endpoint /rss.xml returned HTTP 404 error.
  - id: "myjobmag"
    name: "MyJobMag Kenya"
    type: "rss"
    url: "https://www.myjobmag.co.ke/rss.xml"
    enabled: false

# ------------------------------------------------------------------------------
# HTML Crawlers (Respects robots.txt, 2-second rate-limiting, strict User-Agent)
# ------------------------------------------------------------------------------
crawler:
  user_agent: "JobRadarBot/1.0 (+https://github.com/james/job-radar; ethical career crawler)"
  request_delay_seconds: 2.0
  request_timeout_seconds: 25.0
